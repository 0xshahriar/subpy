name: Feature Request
description: Suggest a new source, flag, output format, or improvement.
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. The one non-negotiable constraint is that
        **subpy keeps zero runtime dependencies** — proposals that require a
        third-party package or an external binary cannot be accepted as-is.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution yet. What is painful today?
      placeholder: "I need to know which subdomains are behind a CDN before I start scanning, but currently I have to pipe into another tool."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like subpy to do? Concrete flags or output examples help a lot.
      placeholder: "Add a `--cdn` flag that annotates each host with its CDN provider, detected from the CNAME chain."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, flags, or workarounds you have tried, and why they fall short.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      options:
        - Sources (passive)
        - DNS engine / resolver
        - Wildcard handling
        - Output formats
        - CLI / flags
        - Performance
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request to implement this.
          required: false
