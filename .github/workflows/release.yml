# SPDX-License-Identifier: MIT
# Release pipeline: build sdist+wheel once, then publish to PyPI and GitHub.
# Publishing uses PyPI Trusted Publishing (OIDC) — there is deliberately NO API
# token or secret in this file.
#
# One-time PyPI setup (required before the first tagged release):
#   PyPI -> Account -> Publishing -> "Add a new pending publisher"
#     PyPI Project Name: subpy
#     Owner:             0xShahriar
#     Repository name:   subpy
#     Workflow name:     release.yml
#     Environment name:  pypi
#   Then, in GitHub: Settings -> Environments -> create an environment named
#   "pypi" (optionally add required reviewers for a manual approve gate).
name: Release

on:
  push:
    # Only semver release tags, e.g. v1.0.0 / v2.3.1.
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata and README rendering
        run: python -m twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # Fail loudly instead of silently publishing an empty archive.
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment is what the PyPI trusted publisher is bound to, so
    # the OIDC subject matches exactly. It also enables manual approval rules.
    environment:
      name: pypi
      url: https://pypi.org/p/subpy
    permissions:
      # id-token: write is the whole mechanism — the action exchanges this
      # short-lived OIDC token for a PyPI upload token. No secrets involved.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Print the resolved upload URL for auditability in the job log.
          print-hash: true

  github-release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release and attach the distribution files.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Need the tag object and full history for note generation.
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Resolve the commit this tag points at
        id: target
        shell: bash
        # Pin target_commitish to a commit SHA rather than letting the action
        # default it. The default is the branch the workflow was dispatched
        # from, which is not always the release's own branch: an earlier run
        # recorded a temporary branch name here, and once that branch was
        # deleted every later call to the release-notes API failed with
        # "Invalid target_commitish parameter". A SHA can never go stale.
        run: |
          set -euo pipefail
          sha="$(git rev-list -n 1 "$GITHUB_REF")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $GITHUB_REF at $sha"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Generated notes are the changelog; the tag is the release name.
          generate_release_notes: true
          target_commitish: ${{ steps.target.outputs.sha }}
          files: |
            dist/*
          draft: false
          prerelease: false
